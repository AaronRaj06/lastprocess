[project]
name = "lps-trainer"
version = "0.1.0"
description = "PPO trainer for Last Process Standing bots"
requires-python = ">=3.11"
dependencies = [
    "gymnasium>=1.0",
    "stable-baselines3>=2.4",
    "torch>=2.4",
    "onnx>=1.16",
    "onnxruntime>=1.19",
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
